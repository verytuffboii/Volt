<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLT | 7-Second Loops</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="top-nav">
        <div class="logo">VOLT</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search creators..." onkeyup="filterVideos()">
        </div>
        <div class="profile-icon">👤</div>
    </nav>

    <main id="video-feed" class="video-container"></main>

    <div id="start-overlay">
        <div class="welcome-box">
            <h1>VOLT</h1>
            <p>Short. Fast. Loops.</p>
            <button onclick="startApp()">START BROWSING</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
